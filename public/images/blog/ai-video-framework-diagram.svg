<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a0f"/>
      <stop offset="50%" stop-color="#0e131d"/>
      <stop offset="100%" stop-color="#06080c"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEBA4"/>
      <stop offset="40%" stop-color="#E5C158"/>
      <stop offset="100%" stop-color="#B88A22"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#192231" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0e1520" stop-opacity="0.95"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle ambient circles -->
  <circle cx="200" cy="150" r="280" fill="#E5C158" opacity="0.04" filter="url(#glow)"/>
  <circle cx="1000" cy="450" r="320" fill="#38bdf8" opacity="0.04" filter="url(#glow)"/>
  <circle cx="600" cy="300" r="220" fill="#eab308" opacity="0.03" filter="url(#glow)"/>

  <!-- Grid lines -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Header Badge & Title -->
  <rect x="420" y="45" width="360" height="34" rx="17" fill="#E5C158" fill-opacity="0.12" stroke="#E5C158" stroke-width="1.2" stroke-opacity="0.4"/>
  <text x="600" y="67" text-anchor="middle" fill="#FCEBA4" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">IMAGE-TO-VIDEO ARCHITECTURE 2026</text>

  <text x="600" y="125" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="0.5">معماری ۴ مرحله‌ای تبدیل عکس ثابت به ویدیوی سینمایی</text>
  <text x="600" y="155" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="15">The 4-Step Prompt Engineering Pipeline (Google Flow • Gemini Omni • Veo)</text>

  <!-- Connecting pipeline line -->
  <line x1="180" y1="340" x2="1020" y2="340" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.6"/>

  <!-- Step 1: Still Reference Image -->
  <g transform="translate(80, 200)">
    <rect width="220" height="280" rx="16" fill="url(#cardGrad)" stroke="#E5C158" stroke-opacity="0.3" stroke-width="1.5"/>
    <circle cx="110" cy="50" r="26" fill="#E5C158" fill-opacity="0.15" stroke="#E5C158" stroke-width="1.5"/>
    <text x="110" y="56" text-anchor="middle" fill="#FCEBA4" font-family="monospace" font-size="16" font-weight="bold">01</text>
    <text x="110" y="105" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="17" font-weight="700">عکس رفرنس تمیز</text>
    <text x="110" y="128" text-anchor="middle" fill="#E5C158" font-family="monospace" font-size="13">Clean Subject Image</text>
    <line x1="30" y1="145" x2="190" y2="145" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="110" y="175" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• تصویر باکیفیت محصول</text>
    <text x="110" y="200" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• زاویه استاندارد استودیویی</text>
    <text x="110" y="225" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• پس‌زمینه ایزوله / تفکیک‌شده</text>
    <rect x="25" y="245" width="170" height="22" rx="6" fill="#E5C158" fill-opacity="0.1"/>
    <text x="110" y="260" text-anchor="middle" fill="#FCEBA4" font-family="monospace" font-size="10" font-weight="600">INPUT: STILL FRAME</text>
  </g>

  <!-- Step 2: Slash Command Direction -->
  <g transform="translate(350, 200)">
    <rect width="220" height="280" rx="16" fill="url(#cardGrad)" stroke="#E5C158" stroke-opacity="0.3" stroke-width="1.5"/>
    <circle cx="110" cy="50" r="26" fill="#E5C158" fill-opacity="0.15" stroke="#E5C158" stroke-width="1.5"/>
    <text x="110" y="56" text-anchor="middle" fill="#FCEBA4" font-family="monospace" font-size="16" font-weight="bold">02</text>
    <text x="110" y="105" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="17" font-weight="700">انتخاب اسلش‌کامند</text>
    <text x="110" y="128" text-anchor="middle" fill="#E5C158" font-family="monospace" font-size="13">Keemfinity Preset</text>
    <line x1="30" y1="145" x2="190" y2="145" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="110" y="175" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• تعیین رفتار حرکت تصویر</text>
    <text x="110" y="200" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• /SmokeReveal یا /GlassBreak</text>
    <text x="110" y="225" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• تفکیک رخدادهای بصری</text>
    <rect x="25" y="245" width="170" height="22" rx="6" fill="#38bdf8" fill-opacity="0.15"/>
    <text x="110" y="260" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="600">PRESET IDENTIFIER</text>
  </g>

  <!-- Step 3: Motion & Physics Prompt -->
  <g transform="translate(620, 200)">
    <rect width="220" height="280" rx="16" fill="url(#cardGrad)" stroke="#E5C158" stroke-opacity="0.3" stroke-width="1.5"/>
    <circle cx="110" cy="50" r="26" fill="#E5C158" fill-opacity="0.15" stroke="#E5C158" stroke-width="1.5"/>
    <text x="110" y="56" text-anchor="middle" fill="#FCEBA4" font-family="monospace" font-size="16" font-weight="bold">03</text>
    <text x="110" y="105" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="17" font-weight="700">تزریق فیزیک و دوربین</text>
    <text x="110" y="128" text-anchor="middle" fill="#E5C158" font-family="monospace" font-size="13">Camera &amp; Physics</text>
    <line x1="30" y1="145" x2="190" y2="145" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="110" y="175" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• زاویه حرکت دوربین (Orbit, Pan)</text>
    <text x="110" y="200" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• سرعت شاتر و نرخ فریم</text>
    <text x="110" y="225" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• رفتار دود، مایع یا ذرات</text>
    <rect x="25" y="245" width="170" height="22" rx="6" fill="#E5C158" fill-opacity="0.1"/>
    <text x="110" y="260" text-anchor="middle" fill="#FCEBA4" font-family="monospace" font-size="10" font-weight="600">LIGHT + KINEMATICS</text>
  </g>

  <!-- Step 4: AI Cinema Video Output -->
  <g transform="translate(890, 200)">
    <rect width="220" height="280" rx="16" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.8"/>
    <circle cx="110" cy="50" r="26" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="110" y="56" text-anchor="middle" fill="#67e8f9" font-family="monospace" font-size="16" font-weight="bold">04</text>
    <text x="110" y="105" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="17" font-weight="700">رندر ویدیویی تجاری</text>
    <text x="110" y="128" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="13">Cinema Grade Video</text>
    <line x1="30" y1="145" x2="190" y2="145" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="110" y="175" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• رندر 4K هالیوودی بدون لرزش</text>
    <text x="110" y="200" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• ثبات هویت محصول (Identity)</text>
    <text x="110" y="225" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• آماده استفاده در تبلیغات</text>
    <rect x="25" y="245" width="170" height="22" rx="6" fill="#22c55e" fill-opacity="0.15"/>
    <text x="110" y="260" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="10" font-weight="600">READY FOR BROADCAST</text>
  </g>

  <!-- Footer Formula -->
  <rect x="180" y="520" width="840" height="52" rx="12" fill="#131b26" stroke="#E5C158" stroke-opacity="0.25"/>
  <text x="600" y="552" text-anchor="middle" fill="#E5C158" font-family="monospace" font-size="14" font-weight="700">
    PROMPT = [COMMAND PRESET] + [IMAGE REFERENCE] + [ATMOSPHERIC LIGHTING] + [CAMERA KINEMATICS]
  </text>
</svg>
